<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WGU Social Media Monitor</title>
<style>
  :root { --accent: #dc2626; --platform-color: #ff0050; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; color: #1a1a2e; }

  .header {
    background: linear-gradient(135deg, var(--accent) 0%, #010101 100%);
    color: white; padding: 24px 32px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    transition: background 0.2s;
  }
  .header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
  .header .context { opacity: 0.75; font-weight: 400; font-size: 0.95rem; }
  .header .updated { font-size: 0.78rem; opacity: 0.7; margin-top: 4px; }
  .badge { background: rgba(255,255,255,0.2); border-radius: 20px; padding: 4px 14px; font-size: 0.85rem; white-space: nowrap; }

  /* ── Tabs ── */
  .school-tabs {
    display: flex; gap: 8px; padding: 14px 32px 0; background: white;
    border-bottom: 1px solid #e5e7eb; flex-wrap: wrap;
  }
  .school-tab {
    padding: 10px 18px; border-radius: 10px 10px 0 0; cursor: pointer;
    font-weight: 600; font-size: 0.9rem; color: #6b7280; background: #f3f4f6;
    border: 1px solid #e5e7eb; border-bottom: none; transition: background 0.15s, color 0.15s;
  }
  .school-tab:hover { background: #e5e7eb; }
  .school-tab.active { border-color: transparent; }

  .platform-tabs {
    display: flex; gap: 8px; padding: 14px 32px; background: #fff;
    border-bottom: 1px solid #e5e7eb; flex-wrap: wrap;
  }
  .platform-tab {
    padding: 7px 14px; border-radius: 20px; font-size: 0.82rem; font-weight: 600;
    cursor: pointer; background: #f3f4f6; color: #6b7280; border: 1px solid #e5e7eb;
    display: flex; align-items: center; gap: 6px; transition: background 0.15s, color 0.15s;
  }
  .platform-tab:hover { background: #e5e7eb; }
  .platform-tab.active { background: #111827; color: white; border-color: #111827; }
  .count-badge { background: rgba(0,0,0,0.08); border-radius: 10px; padding: 1px 8px; font-size: 0.7rem; }
  .platform-tab.active .count-badge { background: rgba(255,255,255,0.2); }

  /* ── Not connected / empty state ── */
  .not-connected {
    margin: 32px; background: white; border-radius: 16px; padding: 64px 32px;
    text-align: center; color: #6b7280; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .not-connected .icon { font-size: 2.6rem; margin-bottom: 14px; }
  .not-connected h2 { font-size: 1.15rem; color: #111827; margin-bottom: 10px; }
  .not-connected p { font-size: 0.9rem; max-width: 480px; margin: 0 auto; line-height: 1.6; }

  /* ── Insights ── */
  .insights { padding: 24px 32px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .insight-card { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
  .insight-card h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--accent); margin-bottom: 12px; font-weight: 700; }
  .insight-card p, .insight-card li { font-size: 0.88rem; color: #374151; line-height: 1.6; }
  .insight-card ul { padding-left: 16px; }
  .insight-card li { margin-bottom: 4px; }
  .school-tag { display: inline-block; background: #fef2f2; color: #dc2626; border-radius: 6px; padding: 2px 8px; font-size: 0.78rem; font-weight: 600; margin: 2px; }
  .creator-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #f3f4f6; font-size: 0.85rem; }
  .creator-row:last-child { border-bottom: none; }
  .creator-row a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .creator-row span { color: #6b7280; font-size: 0.78rem; }
  .section-divider { padding: 0 32px 8px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.8px; color: #9ca3af; font-weight: 600; }

  /* ── Sentiment bar ── */
  .sentiment-bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin: 12px 0 8px; }
  .sentiment-bar .pos { background: #22c55e; }
  .sentiment-bar .neu { background: #94a3b8; }
  .sentiment-bar .neg { background: #ef4444; }
  .sentiment-legend { display: flex; gap: 14px; font-size: 0.8rem; color: #6b7280; flex-wrap: wrap; }
  .sentiment-legend span { display: flex; align-items: center; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

  /* ── Comment bubbles ── */
  .comment-bubble { font-size: 0.82rem; color: #374151; background: #f9fafb; border-radius: 8px; padding: 9px 11px; margin-bottom: 7px; border-left: 3px solid #e5e7eb; line-height: 1.5; }
  .comment-bubble.pos { border-left-color: #22c55e; background: #f0fdf4; }
  .comment-bubble.neg { border-left-color: #ef4444; background: #fef2f2; }

  /* ── Controls ── */
  .controls {
    background: white; padding: 16px 32px; border-bottom: 1px solid #e5e7eb;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .controls input, .controls select {
    border: 1px solid #d1d5db; border-radius: 8px; padding: 8px 14px;
    font-size: 0.9rem; outline: none; background: #f9fafb;
  }
  .controls input { flex: 1; min-width: 200px; }
  .controls input:focus, .controls select:focus { border-color: var(--accent); background: white; }
  .count { margin-left: auto; font-size: 0.85rem; color: #6b7280; white-space: nowrap; }

  /* ── Video grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px; padding: 24px 32px;
  }
  .card {
    background: white; border-radius: 14px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08); transition: transform 0.15s, box-shadow 0.15s;
    display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
  .card-top {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    padding: 18px; color: white;
  }
  .card-meta { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .keyword-tag {
    display: inline-block; background: rgba(255,255,255,0.12); color: var(--platform-color);
    border-radius: 20px; padding: 2px 10px; font-size: 0.72rem; font-weight: 600;
  }
  .sentiment-badge {
    display: inline-block; border-radius: 20px; padding: 2px 10px; font-size: 0.72rem; font-weight: 600;
  }
  .sentiment-badge.Positive { background: rgba(34,197,94,0.25);  color: #86efac; }
  .sentiment-badge.Negative { background: rgba(239,68,68,0.25);  color: #fca5a5; }
  .sentiment-badge.Neutral  { background: rgba(148,163,184,0.2); color: #cbd5e1; }
  .creator { font-weight: 600; font-size: 1rem; margin-bottom: 8px; }
  .creator a { color: var(--platform-color); text-decoration: none; }
  .creator a:hover { text-decoration: underline; }
  .caption {
    font-size: 0.85rem; opacity: 0.85; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    border-bottom: 1px solid #f3f4f6; text-align: center;
  }
  .stat { padding: 10px 4px; }
  .stat-val { font-size: 0.9rem; font-weight: 600; color: #111827; }
  .stat-lbl { font-size: 0.68rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; }
  .card-comments { padding: 10px 16px; background: #fafafa; border-top: 1px solid #f3f4f6; }
  .card-comments-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.5px; color: #9ca3af; margin-bottom: 5px; }
  .comment-mini { font-size: 0.75rem; color: #6b7280; padding: 3px 0; border-bottom: 1px solid #f3f4f6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .comment-mini:last-child { border-bottom: none; }
  .comment-mini.pos { color: #16a34a; }
  .comment-mini.neg { color: #dc2626; }
  .card-footer {
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; margin-top: auto;
  }
  .date { font-size: 0.78rem; color: #9ca3af; }
  .watch-btn {
    background: var(--platform-color); color: white; text-decoration: none;
    border-radius: 8px; padding: 7px 16px; font-size: 0.82rem; font-weight: 600;
    transition: opacity 0.15s;
  }
  .watch-btn:hover { opacity: 0.85; }
  .empty { text-align: center; padding: 80px 32px; color: #9ca3af; font-size: 1rem; grid-column: 1/-1; }
</style>
</head>

const SCHOOL_META    = {"health": {"label": "School of Health & Life Sciences", "short": "Health", "emoji": "\ud83e\ude7a", "accent": "#dc2626"}, "business": {"label": "School of Business", "short": "Business", "emoji": "\ud83d\udcbc", "accent": "#2563eb"}, "tech": {"label": "School of Technology", "short": "Technology", "emoji": "\ud83d\udcbb", "accent": "#7c3aed"}, "education": {"label": "School of Education", "short": "Education", "emoji": "\ud83c\udf93", "accent": "#059669"}};
const PLATFORM_META  = {"tiktok": {"label": "TikTok", "emoji": "\ud83c\udfb5", "color": "#ff0050", "implemented": true}, "instagram": {"label": "Instagram", "emoji": "\ud83d\udcf8", "color": "#e1306c", "implemented": false}, "facebook": {"label": "Facebook", "emoji": "\ud83d\udc4d", "color": "#1877f2", "implemented": false}};
const SCHOOL_KEYS    = ["health", "business", "tech", "education"];
const PLATFORM_KEYS  = ["tiktok", "instagram", "facebook"];

let currentSchool   = SCHOOL_KEYS[0];
let currentPlatform = 'tiktok';

function fmt(n) {
  if (!n && n !== 0) return '—';
  const num = parseInt(n);
  if (isNaN(num)) return '—';
  if (num >= 1000000) return (num/1000000).toFixed(1) + 'M';
  if (num >= 1000) return (num/1000).toFixed(1) + 'K';
  return num.toLocaleString();
}

function sentimentEmoji(s) {
  if (s === 'Positive') return '😊';
  if (s === 'Negative') return '😟';
  return '😐';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function profileBase(platform) {
  if (platform === 'tiktok')    return 'https://www.tiktok.com/@';
  if (platform === 'instagram') return 'https://www.instagram.com/';
  return 'https://www.facebook.com/';
}

function buildSchoolTabs() {
  const el = document.getElementById('school-tabs');
  el.innerHTML = SCHOOL_KEYS.map(k => {
    const m = SCHOOL_META[k];
    return `<button class="school-tab" data-school="${k}">${m.emoji} ${m.short}</button>`;
  }).join('');
  el.querySelectorAll('.school-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentSchool = btn.dataset.school;
      currentPlatform = 'tiktok';
      renderAll();
    });
  });
}

function buildPlatformTabs() {
  const el = document.getElementById('platform-tabs');
  el.innerHTML = PLATFORM_KEYS.map(p => {
    const pm = PLATFORM_META[p];
    const d  = DATA[currentSchool][p];
    const badge = d.hasData
      ? `<span class="count-badge">${d.rows.length}</span>`
      : `<span class="count-badge">${d.implemented ? '0' : 'Coming soon'}</span>`;
    return `<button class="platform-tab" data-platform="${p}">${pm.emoji} ${pm.label} ${badge}</button>`;
  }).join('');
  el.querySelectorAll('.platform-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentPlatform = btn.dataset.platform;
      renderAll();
    });
  });
}

function updateActiveClasses() {
  const accent = SCHOOL_META[currentSchool].accent;
  document.querySelectorAll('.school-tab').forEach(btn => {
    const active = btn.dataset.school === currentSchool;
    btn.classList.toggle('active', active);
    btn.style.background = active ? accent : '';
    btn.style.color = active ? '#fff' : '';
  });
  document.querySelectorAll('.platform-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.platform === currentPlatform);
  });
  document.documentElement.style.setProperty('--accent', accent);
  document.documentElement.style.setProperty('--platform-color', PLATFORM_META[currentPlatform].color);
  document.getElementById('header-context').textContent =
    `— ${SCHOOL_META[currentSchool].emoji} ${SCHOOL_META[currentSchool].label} · ${PLATFORM_META[currentPlatform].label}`;
}

function populateControls(d) {
  const kf = document.getElementById('keyword-filter');
  kf.innerHTML = '<option value="">All keywords</option>' +
    d.keywords.map(k => `<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`).join('');
  document.getElementById('search').value = '';
  document.getElementById('sentiment-filter').value = '';
  document.getElementById('sort').value = 'found_desc';
}

function renderInsights(d) {
  const wrap = document.getElementById('insights');
  const ins = d.insights;
  if (!ins) { wrap.innerHTML = ''; return; }

  const themesHtml = ins.themes.length
    ? ins.themes.map(([t,c]) => `<li><strong>${escapeHtml(t)}</strong> — ${c} mentions</li>`).join('')
    : "<li style='color:#9ca3af'>Not enough data yet</li>";

  const schoolsHtml = ins.competingSchools.length
    ? ins.competingSchools.map(([s,c]) => `<span class="school-tag">${escapeHtml(s)} <strong style="opacity:0.7">×${c}</strong></span>`).join('')
    : "<span style='color:#9ca3af'>Not enough data yet</span>";

  const creatorsHtml = ins.creators.length
    ? ins.creators.map(([cr,cnt]) => `<div class="creator-row"><a href="${profileBase(currentPlatform)}${encodeURIComponent(cr)}" target="_blank">@${escapeHtml(cr)}</a><span>${cnt} video${cnt>1?'s':''}</span></div>`).join('')
    : "<span style='color:#9ca3af'>Not enough data yet</span>";

  function bubble(c, cls) {
    const text = c.comment.length > 160 ? c.comment.slice(0,160) + '…' : c.comment;
    const creator = (ins.usingCaptionsFallback && c.creator)
      ? `<span style="font-size:0.7rem;opacity:0.6"> — @${escapeHtml(c.creator)}</span>` : '';
    return `<div class="comment-bubble ${cls}">💬 ${escapeHtml(text)}${creator}</div>`;
  }
  const posHtml = ins.posComments.length ? ins.posComments.map(c => bubble(c,'pos')).join('') : "<span style='color:#9ca3af'>Not enough data yet</span>";
  const negHtml = ins.negComments.length ? ins.negComments.map(c => bubble(c,'neg')).join('') : "<span style='color:#9ca3af'>Not enough data yet</span>";

  wrap.innerHTML = `
    <div class="insight-card">
      <h3>🔥 Top Themes</h3>
      <ul>${themesHtml}</ul>
    </div>
    <div class="insight-card">
      <h3>🏫 Competing Schools Mentioned</h3>
      ${schoolsHtml}
    </div>
    <div class="insight-card">
      <h3>👤 Most Active Creators</h3>
      ${creatorsHtml}
    </div>
    <div class="insight-card">
      <h3>📊 Quick Stats</h3>
      <ul>
        <li><strong>${ins.totalVideos}</strong> total videos collected</li>
        <li><strong>${ins.uniqueCreators}</strong> unique creators</li>
        <li><strong>${ins.keywordsTracked}</strong> keywords tracked</li>
        <li><strong>${ins.commentsScraped}</strong> comments scraped</li>
      </ul>
    </div>
    <div class="insight-card">
      <h3>😊 Caption Sentiment Breakdown</h3>
      <div class="sentiment-bar">
        <div class="pos" style="width:${ins.posPct}%"></div>
        <div class="neu" style="width:${ins.neuPct}%"></div>
        <div class="neg" style="width:${ins.negPct}%"></div>
      </div>
      <div class="sentiment-legend">
        <span><span class="dot" style="background:#22c55e"></span>Positive ${ins.posPct}%</span>
        <span><span class="dot" style="background:#94a3b8"></span>Neutral ${ins.neuPct}%</span>
        <span><span class="dot" style="background:#ef4444"></span>Negative ${ins.negPct}%</span>
      </div>
      <p style="margin-top:10px; font-size:0.78rem; color:#6b7280;">Based on caption text across ${ins.totalVideos} videos</p>
    </div>
    <div class="insight-card">
      <h3>💬 What People Are Saying (Positive)</h3>
      <p style="font-size:0.72rem;color:#9ca3af;margin-bottom:8px;">From video ${ins.sourceLabel}s</p>
      ${posHtml}
    </div>
    <div class="insight-card">
      <h3>⚠️ What People Are Saying (Negative)</h3>
      <p style="font-size:0.72rem;color:#9ca3af;margin-bottom:8px;">From video ${ins.sourceLabel}s</p>
      ${negHtml}
    </div>
  `;
}

function renderGrid(d) {
  const q    = document.getElementById('search').value.toLowerCase();
  const kw   = document.getElementById('keyword-filter').value;
  const sent = document.getElementById('sentiment-filter').value;
  const sort = document.getElementById('sort').value;
  const grid = document.getElementById('grid');

  let data = d.rows.filter(v => {
    if (kw   && v.keyword   !== kw)   return false;
    if (sent && v.sentiment !== sent) return false;
    if (q    && !v.caption.toLowerCase().includes(q) && !v.creator.toLowerCase().includes(q)) return false;
    return true;
  });

  if (sort === 'views_desc')  data.sort((a,b) => (parseInt(b.views)||0)  - (parseInt(a.views)||0));
  if (sort === 'likes_desc')  data.sort((a,b) => (parseInt(b.likes)||0)  - (parseInt(a.likes)||0));
  if (sort === 'posted_desc') data.sort((a,b) => b.posted.localeCompare(a.posted));
  if (sort === 'found_desc')  data.sort((a,b) => b.found.localeCompare(a.found));

  document.getElementById('result-count').textContent = data.length + ' video' + (data.length !== 1 ? 's' : '');
  document.getElementById('total-badge').textContent  = d.rows.length + ' total videos';
  document.getElementById('section-divider').textContent =
    `${PLATFORM_META[currentPlatform].label} Videos (${d.rows.length})`;

  if (!data.length) {
    grid.innerHTML = '<div class="empty">No videos match your filters.</div>';
    return;
  }

  const base = profileBase(currentPlatform);

  grid.innerHTML = data.map(v => {
    const commentsHtml = v.top_comments && v.top_comments.length
      ? `<div class="card-comments">
           <div class="card-comments-label">Top Comments</div>
           ${v.top_comments.map(c =>
             `<div class="comment-mini ${c.sentiment === 'Positive' ? 'pos' : c.sentiment === 'Negative' ? 'neg' : ''}">${escapeHtml(c.text)}</div>`
           ).join('')}
         </div>`
      : '';

    return `
    <div class="card">
      <div class="card-top">
        <div class="card-meta">
          <span class="keyword-tag">${escapeHtml(v.keyword)}</span>
          <span class="sentiment-badge ${v.sentiment}">${sentimentEmoji(v.sentiment)} ${v.sentiment}</span>
        </div>
        <div class="creator"><a href="${base}${encodeURIComponent(v.creator)}" target="_blank">@${escapeHtml(v.creator)}</a></div>
        <div class="caption">${escapeHtml(v.caption) || '(no caption)'}</div>
      </div>
      <div class="card-stats">
        <div class="stat"><div class="stat-val">${fmt(v.views)}</div><div class="stat-lbl">Views</div></div>
        <div class="stat"><div class="stat-val">${fmt(v.likes)}</div><div class="stat-lbl">Likes</div></div>
        <div class="stat"><div class="stat-val">${fmt(v.comments)}</div><div class="stat-lbl">Comments</div></div>
        <div class="stat"><div class="stat-val">${fmt(v.shares)}</div><div class="stat-lbl">Shares</div></div>
      </div>
      ${commentsHtml}
      <div class="card-footer">
        <span class="date">${v.posted || v.found}</span>
        <a class="watch-btn" href="${v.url}" target="_blank">Watch ↗</a>
      </div>
    </div>
  `;
  }).join('');
}

function renderAll() {
  buildPlatformTabs();
  updateActiveClasses();

  const d = DATA[currentSchool][currentPlatform];
  const controlsEl      = document.getElementById('controls');
  const insightsEl       = document.getElementById('insights');
  const notConnectedEl   = document.getElementById('not-connected');
  const gridEl           = document.getElementById('grid');
  const dividerEl        = document.getElementById('section-divider');

  if (!d.hasData) {
    controlsEl.style.display = 'none';
    insightsEl.style.display = 'none';
    dividerEl.style.display  = 'none';
    gridEl.style.display     = 'none';
    notConnectedEl.style.display = 'block';

    const pm = PLATFORM_META[currentPlatform];
    const sm = SCHOOL_META[currentSchool];
    if (d.implemented) {
      notConnectedEl.innerHTML = `
        <div class="icon">${pm.emoji}</div>
        <h2>No ${pm.label} videos collected yet for ${sm.label}</h2>
        <p>This runs on a schedule — once the monitor completes its next pass over the ${sm.short} keyword list, videos and sentiment will show up here.</p>`;
    } else {
      notConnectedEl.innerHTML = `
        <div class="icon">${pm.emoji}</div>
        <h2>${pm.label} monitoring isn't connected yet</h2>
        <p>${pm.label} blocks automated search much more aggressively than TikTok, so this needs a dedicated data source (official API access, or a cookie-based scraper) before it can populate. Once that's wired up for ${sm.label}, it'll appear here automatically — same layout as TikTok.</p>`;
    }
    document.getElementById('total-badge').textContent = '0 total videos';
    document.getElementById('result-count').textContent = '';
    return;
  }

  notConnectedEl.style.display = 'none';
  controlsEl.style.display     = 'flex';
  insightsEl.style.display     = 'grid';
  dividerEl.style.display      = 'block';
  gridEl.style.display         = 'grid';

  populateControls(d);
  renderInsights(d);
  renderGrid(d);
}

buildSchoolTabs();
['search','keyword-filter','sentiment-filter','sort'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener(id === 'search' ? 'input' : 'change', () => renderGrid(DATA[currentSchool][currentPlatform]));
});

renderAll();
</script>
</body>
</html>
